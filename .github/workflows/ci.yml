name: ci

on:
  push:
    branches: *
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11  # match scholar.bundledBunVersion

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bunx tsc --noEmit

      - name: compile
        run: bun run build:vec

      - name: test
        run: bun test --bail --only-failures

      - name: smoke
        run: |
          bun -e '
            import { Database } from "bun:sqlite";
            const db = new Database(":memory:");
            const so = "runtime/vendor/sqlite-vec/vec0.so"
            const q = "SELECT vec_version() as v"
            const r = "CREATE VIRTUAL TABLE v USING vec0(emb float[4])"
            db.loadExtension(so, "sqlite3_vec_init");
            console.log("version:", db.query(q).get());
            db.run(r);
            console.log("CREATE VTAB vec0: ok");
          '
